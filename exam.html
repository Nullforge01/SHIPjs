<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Final Exam — ShipJS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="wrap">
      <div class="logo-wrap">
        <a href="/course.html" class="back-btn">←</a>
        <a href="/" class="logo">Ship<span>.js</span></a>
      </div>
      <div class="stats">
        <div class="pill"><span data-xp>0</span> XP</div>
        <div class="timer">Time: <span id="exam-timer">30:00</span></div>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 40px 24px; max-width: 900px;">
    <div class="exam-header">
      <h1>Final Certification Exam</h1>
      <p class="muted">Score 70%+ to unlock your certificate. 30 minute limit.</p>
      <div class="exam-timer mono" id="timer-display">30:00</div>
    </div>

    <div id="exam-questions" class="exam-questions"></div>

    <div class="exam-footer">
      <button id="submit-exam" class="btn btn-primary" style="font-size: 16px; padding: 14px 32px;">
        Submit Exam
      </button>
    </div>
  </main>
</div>

<div id="result-modal" class="modal">
  <div class="modal-content">
    <div class="success-icon" id="result-icon">🏆</div>
    <h3 id="result-title">Exam Complete</h3>
    <p id="result-score" style="font-size: 24px; font-weight: 700; color: var(--primary);">0%</p>
    <p id="result-msg" class="muted">Calculating...</p>
    <div class="modal-actions">
      <a id="cert-link" href="/cert.html" class="btn btn-primary" style="display: none;">View Certificate</a>
      <button id="retry-btn" class="btn btn-secondary" style="display: none;">Retry Exam</button>
      <a href="/course.html" class="btn btn-secondary">Back to Course</a>
    </div>
  </div>
</div>

<script type="module">
  import { ShipJS } from './js/app.js';
  import { createEditor } from './js/editor.js';
  import { runTests } from './js/tests.js';
  
  const app = new ShipJS();
  await app.init();
  
  const course = await app.loadCourse();
  const exam = course.exam;
  const state = app.getState();
  
  if (state.cert.unlocked) {
    location.href = '/cert.html';
  }
  
  // Timer: 30 minutes
  let timeLeft = 30 * 60;
  const timerEl = document.getElementById('exam-timer');
  const timerDisplay = document.getElementById('timer-display');
  
  const timerInterval = setInterval(() => {
    timeLeft--;
    const mins = Math.floor(timeLeft / 60);
    const secs = timeLeft % 60;
    const timeStr = `${mins}:${secs.toString().padStart(2, '0')}`;
    timerEl.textContent = timeStr;
    timerDisplay.textContent = timeStr;
    
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      submitExam();
    }
  }, 1000);
  
  // Render questions
  const questionsEl = document.getElementById('exam-questions');
  const editors = {};
  
  exam.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'card question-card';
    
    if (q.type === 'mcq') {
      card.innerHTML = `
        <h3>Q${i + 1}. ${q.question}</h3>
        <div class="options">
          ${q.options.map((opt, j) => `
            <label class="option">
              <input type="radio" name="q${q.id}" value="${j}">
              <span>${opt}</span>
            </label>
          `).join('')}
        </div>
      `;
    } else if (q.type === 'code') {
      card.innerHTML = `
        <h3>Q${i + 1}. ${q.question}</h3>
        <div id="exam-editor-${q.id}" class="exam-editor"></div>
      `;
      
      setTimeout(async () => {
        editors[q.id] = await createEditor(`exam-editor-${q.id}`, q.starterCode);
      }, 0);
    }
    
    questionsEl.appendChild(card);
  });
  
  // Submit
  document.getElementById('submit-exam').onclick = submitExam;
  
  async function submitExam() {
    clearInterval(timerInterval);
    document.getElementById('submit-exam').disabled = true;
    
    let correct = 0;
    let total = exam.length;
    
    for (const q of exam) {
      if (q.type === 'mcq') {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        if (selected && parseInt(selected.value) === q.answer) {
          correct++;
        }
      } else if (q.type === 'code') {
        const code = editors[q.id].getValue();
        try {
          const testFn = new Function('return ' + code + '\n' + `
            ${q.tests.map(t => `if (double(${t.input}) !== ${t.output}) throw new Error();`).join('\n')}
          `);
          testFn();
          correct++;
        } catch (e) {
          // Failed
        }
      }
    }
    
    const score = Math.round((correct / total) * 100);
    const passed = score >= 70;
    
    // Show result
    const modal = document.getElementById('result-modal');
    document.getElementById('result-score').textContent = `${score}%`;
    document.getElementById('result-icon').textContent = passed ? '🏆' : '❌';
    document.getElementById('result-title').textContent = passed ? 'You Passed!' : 'Not Quite';
    document.getElementById('result-msg').textContent = passed 
      ? `You got ${correct}/${total} correct. Your certificate is ready.`
      : `You got ${correct}/${total} correct. You need 70% to pass. Review and try again.`;
    
    if (passed) {
      app.unlockCert();
      document.getElementById('cert-link').style.display = 'block';
    } else {
      document.getElementById('retry-btn').style.display = 'block';
      document.getElementById('retry-btn').onclick = () => location.reload();
    }
    
    modal.classList.add('active');
  }
</script>
</body>
</html>
