<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Course — ShipJS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="wrap">
      <div class="logo-wrap">
        <a href="/" class="logo">Ship<span>.js</span></a>
      </div>
      <div class="stats">
        <div class="pill"><span data-xp>0</span> XP</div>
        <div class="pill"><span data-streak>0</span>🔥</div>
        <a href="/exam.html" class="btn btn-secondary">Final Exam</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 40px 24px;">
    <div style="margin-bottom: 40px;">
      <h1 style="font-size: 32px; margin-bottom: 8px;">Your Course</h1>
      <p class="muted">Test-driven JavaScript. Ship real code.</p>
    </div>

    <div class="hero-stats" style="margin-bottom: 40px;">
      <div class="stat">
        <div class="stat-num"><span data-xp>0</span></div>
        <div class="stat-label">Total XP</div>
      </div>
      <div class="stat">
        <div class="stat-num"><span id="lessons-done">0</span>/<span id="lessons-total">0</span></div>
        <div class="stat-label">Lessons Done</div>
      </div>
      <div class="stat">
        <div class="stat-num"><span id="projects-done">0</span>/<span id="projects-total">0</span></div>
        <div class="stat-label">Projects Shipped</div>
      </div>
    </div>

    <div id="modules" class="modules"></div>
  </main>
</div>

<script type="module">
  import { ShipJS } from './js/app.js';
  
  const app = new ShipJS();
  await app.init();
  
  const course = await app.loadCourse();
  const state = app.getState();
  
  // Update totals
  let totalLessons = 0, totalProjects = 0;
  course.modules.forEach(m => {
    m.lessons.forEach(l => {
      totalLessons++;
      if (l.type === 'project') totalProjects++;
    });
  });
  
  document.getElementById('lessons-total').textContent = totalLessons;
  document.getElementById('projects-total').textContent = totalProjects;
  document.getElementById('lessons-done').textContent = state.progress.length;
  document.getElementById('projects-done').textContent = state.progress.filter(id => {
    const lesson = course.modules.flatMap(m => m.lessons).find(l => l.id === id);
    return lesson?.type === 'project';
  }).length;
  
  // Render modules
  const modulesEl = document.getElementById('modules');
  course.modules.forEach((module, i) => {
    const completed = module.lessons.filter(l => state.progress.includes(l.id)).length;
    const locked = i > 0 && !course.modules[i-1].lessons.every(l => state.progress.includes(l.id));
    
    const card = document.createElement('div');
    card.className = `card ${locked ? 'locked' : ''}`;
    card.innerHTML = `
      <div class="module-header">
        <div>
          <h3 style="font-size: 20px; margin-bottom: 4px;">${module.title}</h3>
          <p class="muted" style="font-size: 14px;">${module.description}</p>
        </div>
        <div class="muted" style="font-size: 14px;">
          ${completed}/${module.lessons.length} ${locked ? '🔒' : ''}
        </div>
      </div>
      <div class="lessons" style="display: ${locked ? 'none' : 'block'};">
        ${module.lessons.map(lesson => {
          const done = state.progress.includes(lesson.id);
          return `
            <a href="/lesson.html?id=${lesson.id}" class="lesson-item ${done ? 'complete' : ''}">
              <div style="display: flex; align-items: center; gap: 12px;">
                <span>${done ? '✓' : '○'}</span>
                <span>${lesson.title}</span>
                ${lesson.type === 'project' ? '<span class="badge">Project</span>' : ''}
              </div>
              <span class="muted" style="font-size: 13px;">${lesson.xp} XP</span>
            </a>
          `;
        }).join('')}
      </div>
    `;
    
    if (!locked) {
      card.querySelector('.module-header').onclick = () => {
        const lessons = card.querySelector('.lessons');
        lessons.style.display = lessons.style.display === 'none' ? 'block' : 'none';
      };
    }
    
    modulesEl.appendChild(card);
  });
</script>
</body>
</html>
